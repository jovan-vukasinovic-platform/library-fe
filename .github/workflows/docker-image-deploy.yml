# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
name: Docker Image Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: jovanvukasinovic/jovan-vukasinovic-platform

jobs:
  docker:
    name: Build & Push Frontend image
    runs-on: ubuntu-latest
    # workflow se okida ili ručnim pokretanjem ili ako uspešno CI prođe
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build-uj tačno onaj commit koji je prošao CI (ne najnoviji main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Generate Image tag
        id: image
        shell: bash
        run: |
          DATE_TAG=$(date -u +'%Y%m%d')
          FULL_TAG="${IMAGE_NAME}:library-fe-${DATE_TAG}"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Docker image: ${FULL_TAG}"     

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.full_tag }}
            ${{ env.IMAGE_NAME }}:library-fe-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
